<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Willkommen beim irischen Troll</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Quicksand:wght@400;600&display=swap');

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #064e3b 0%, #065f46 50%, #047857 100%);
            margin: 0;
            overflow-x: hidden;
        }

        h1, .celtic-font {
            font-family: 'Cinzel', serif;
        }

        /* Floating Animation für die Kleeblätter */
        .shamrock {
            position: absolute;
            color: #34d399;
            opacity: 0.3;
            animation: float 15s linear infinite;
            z-index: 0;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg) scale(1); opacity: 0; }
            10% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% { transform: translateY(-20vh) rotate(360deg) scale(1.5); opacity: 0; }
        }

        /* Sanftes Wippen für den Troll */
        .troll-bounce {
            animation: bounce 3s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Glühender Gold-Effekt */
        .gold-glow {
            filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.6));
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center text-white relative">

    <!-- Animierte Hintergrund-Kleeblätter -->
    <div class="shamrock text-4xl" style="left: 10%; animation-delay: 0s;">☘️</div>
    <div class="shamrock text-6xl" style="left: 30%; animation-delay: 4s;">☘️</div>
    <div class="shamrock text-3xl" style="left: 50%; animation-delay: 2s;">☘️</div>
    <div class="shamrock text-5xl" style="left: 70%; animation-delay: 7s;">☘️</div>
    <div class="shamrock text-4xl" style="left: 90%; animation-delay: 1s;">☘️</div>
    <div class="shamrock text-2xl" style="left: 20%; animation-delay: 9s;">☘️</div>
    <div class="shamrock text-7xl" style="left: 80%; animation-delay: 5s;">☘️</div>

    <!-- Hauptinhalt -->
    <main class="z-10 bg-white/10 backdrop-blur-lg border border-white/20 rounded-3xl p-8 md:p-12 shadow-2xl max-w-2xl w-full mx-4 text-center">
        
        <div class="flex justify-center mb-6">
            <span class="text-4xl">✨</span>
            <h1 class="text-4xl md:text-5xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-green-300 via-yellow-300 to-green-300 celtic-font mx-4">
                Willkommen beim irischen Troll
            </h1>
            <span class="text-4xl">✨</span>
        </div>

        <p class="text-lg md:text-xl text-green-100 mb-10 font-semibold">
            Tritt ein in die magische Welt der grünen Hügel und versteckten Schätze!
        </p>

        <!-- Troll Illustration (SVG) -->
        <div class="flex justify-center mb-10 troll-bounce">
            <svg width="250" height="250" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" class="gold-glow">
                <!-- Hintergrund-Glow/Aura -->
                <circle cx="100" cy="100" r="90" fill="#fbbf24" opacity="0.2" />
                
                <!-- Goldtopf -->
                <path d="M 50 160 Q 50 190 100 190 Q 150 190 150 160 L 160 140 L 40 140 Z" fill="#1f2937" />
                <rect x="35" y="140" width="130" height="10" rx="5" fill="#111827" />
                <!-- Goldmünzen -->
                <circle cx="70" cy="135" r="12" fill="#fbbf24" />
                <circle cx="90" cy="130" r="14" fill="#f59e0b" />
                <circle cx="110" cy="132" r="15" fill="#fbbf24" />
                <circle cx="130" cy="138" r="11" fill="#f59e0b" />
                <circle cx="100" cy="140" r="12" fill="#fbbf24" />
                
                <!-- Troll Körper/Kopf -->
                <circle cx="100" cy="95" r="40" fill="#4ade80" />
                
                <!-- Ohren -->
                <path d="M 60 95 Q 40 85 50 110 Q 60 105 65 100" fill="#4ade80" />
                <path d="M 140 95 Q 160 85 150 110 Q 140 105 135 100" fill="#4ade80" />

                <!-- Gesicht -->
                <!-- Augen -->
                <circle cx="85" cy="85" r="6" fill="#064e3b" />
                <circle cx="115" cy="85" r="6" fill="#064e3b" />
                <!-- Glanz in den Augen -->
                <circle cx="83" cy="83" r="2" fill="white" />
                <circle cx="113" cy="83" r="2" fill="white" />
                
                <!-- Rote Bäckchen -->
                <circle cx="75" cy="100" r="8" fill="#22c55e" opacity="0.6" />
                <circle cx="125" cy="100" r="8" fill="#22c55e" opacity="0.6" />

                <!-- Freundliches Lächeln -->
                <path d="M 85 110 Q 100 125 115 110" stroke="#064e3b" stroke-width="4" stroke-linecap="round" fill="none" />

                <!-- Irischer Hut (Zylinder) -->
                <!-- Hutkrempe -->
                <ellipse cx="100" cy="65" rx="55" ry="10" fill="#065f46" />
                <!-- Hutkörper -->
                <path d="M 65 65 L 75 20 Q 100 15 125 20 L 135 65 Z" fill="#047857" />
                <!-- Schwarzes Hutband -->
                <path d="M 67 55 L 133 55 L 135 65 L 65 65 Z" fill="#111827" />
                <!-- Goldene Schnalle -->
                <rect x="90" y="52" width="20" height="15" rx="2" fill="none" stroke="#fbbf24" stroke-width="3" />
                <rect x="95" y="55" width="10" height="9" fill="#111827" />
            </svg>
        </div>

        <!-- Troll Mathe-Spiel (3. Klasse) -->
        <div class="bg-green-900/60 rounded-3xl p-6 md:p-8 max-w-lg mx-auto border border-green-400/30 shadow-inner">
            <div class="flex justify-between items-center mb-6 border-b border-green-500/50 pb-4">
                <h2 class="text-xl md:text-2xl font-bold text-yellow-300 celtic-font">Troll-Mathe</h2>
                <div class="text-lg md:text-xl font-semibold bg-green-800 px-4 py-2 rounded-full border border-yellow-500/50 shadow-md">
                    Goldmünzen: <span id="scoreDisplay" class="text-yellow-400">0</span> 🍯
                </div>
            </div>

            <div class="mb-8 h-32 flex flex-col justify-center">
                <p id="trollMessage" class="text-green-100 text-sm md:text-base h-12 flex items-center justify-center italic transition-all duration-300">
                    "Löse meine Aufgaben und verdiene Goldmünzen!"
                </p>
                <div id="questionDisplay" class="text-4xl md:text-5xl font-bold text-white mt-2 tracking-wider drop-shadow-lg">
                    Lade...
                </div>
            </div>

            <form id="gameForm" class="flex flex-col sm:flex-row gap-4 justify-center items-center" onsubmit="checkAnswer(event)">
                <input type="number" id="answerInput" required autocomplete="off"
                       class="w-32 h-14 text-center text-2xl font-bold text-green-900 bg-white rounded-xl border-4 border-yellow-400 focus:outline-none focus:border-yellow-300 focus:ring-4 focus:ring-yellow-500/50 transition-all shadow-inner"
                       placeholder="?">
                <button type="submit" 
                        class="w-full sm:w-auto h-14 bg-gradient-to-r from-yellow-500 to-yellow-600 hover:from-yellow-400 hover:to-yellow-500 text-green-900 font-bold py-2 px-8 rounded-xl shadow-lg transform transition hover:scale-105 active:scale-95 focus:outline-none">
                    Antworten 🍀
                </button>
            </form>
        </div>

    </main>

    <!-- Footer -->
    <!-- Footer -->
    <footer class="absolute bottom-4 text-green-300/60 text-sm text-center w-full z-10">
        © 2026 Die kleine irische Taverne am Ende des Regenbogens
    </footer>

    <script>
        let currentAnswer = 0;
        let score = 0;
        let isWaiting = false;

        function initGame() {
            generateProblem();
        }

        function generateProblem() {
            // Aufgabentypen: add2, add3, sub2, sub3, mul, div
            const types = ['add2', 'add3', 'sub2', 'sub3', 'mul', 'div'];
            const type = types[Math.floor(Math.random() * types.length)];
            let qText = '';

            if (type === 'add2') {
                let a = Math.floor(Math.random() * 400) + 10;
                let b = Math.floor(Math.random() * 400) + 10;
                qText = `${a} + ${b}`;
                currentAnswer = a + b;
            } else if (type === 'add3') {
                let a = Math.floor(Math.random() * 200) + 10;
                let b = Math.floor(Math.random() * 200) + 10;
                let c = Math.floor(Math.random() * 200) + 10;
                qText = `${a} + ${b} + ${c}`;
                currentAnswer = a + b + c;
            } else if (type === 'sub2') {
                let a = Math.floor(Math.random() * 400) + 100;
                let b = Math.floor(Math.random() * (a - 10)) + 10;
                qText = `${a} - ${b}`;
                currentAnswer = a - b;
            } else if (type === 'sub3') {
                let a = Math.floor(Math.random() * 400) + 200;
                let b = Math.floor(Math.random() * (a / 2)) + 10;
                let c = Math.floor(Math.random() * (a / 2 - 10)) + 10;
                qText = `${a} - ${b} - ${c}`;
                currentAnswer = a - b - c;
            } else if (type === 'mul') {
                let a = Math.floor(Math.random() * 10) + 1;
                let b = Math.floor(Math.random() * 10) + 1;
                qText = `${a} · ${b}`; // Malpunkt für deutsche Schulen
                currentAnswer = a * b;
            } else if (type === 'div') {
                let b = Math.floor(Math.random() * 10) + 1;
                let ans = Math.floor(Math.random() * 10) + 1;
                let a = b * ans;
                qText = `${a} : ${b}`; // Geteiltzeichen für deutsche Schulen
                currentAnswer = ans;
            }

            document.getElementById('questionDisplay').innerText = qText + ' =';
            const input = document.getElementById('answerInput');
            input.value = '';
            input.disabled = false;
            input.focus();
            isWaiting = false;
        }

        function checkAnswer(event) {
            event.preventDefault();
            if (isWaiting) return;
            isWaiting = true;

            const input = document.getElementById('answerInput');
            const userAns = parseInt(input.value);
            const msgEl = document.getElementById('trollMessage');

            if (isNaN(userAns)) {
                isWaiting = false;
                return;
            }

            input.disabled = true;

            if (userAns === currentAnswer) {
                score++;
                msgEl.innerText = "Klasse! Richtige Antwort! Hier ist eine Goldmünze! 🪙";
                msgEl.className = "text-yellow-300 font-bold text-sm md:text-base h-12 flex items-center justify-center scale-110 transition-transform drop-shadow-md";
            } else {
                msgEl.innerText = `Oje, das war nicht ganz richtig. ${currentAnswer} wäre richtig gewesen.`;
                msgEl.className = "text-red-300 text-sm md:text-base h-12 flex items-center justify-center font-bold";
            }

            document.getElementById('scoreDisplay').innerText = score;
            
            // Kurze Pause, damit das Kind die Lösung und das Feedback lesen kann
            setTimeout(() => {
                msgEl.innerText = '"Auf zur nächsten Aufgabe!"';
                msgEl.className = "text-green-100 text-sm md:text-base h-12 flex items-center justify-center italic transition-all duration-300";
                generateProblem();
            }, 2500);
        }

        // Spiel beim Laden starten
        window.onload = initGame;
    </script>
</body>
</html>
